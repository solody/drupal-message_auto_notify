
message_auto_notify.test_controller_test:
  path: '/message_auto_notify/test'
  defaults:
    _controller: '\Drupal\message_auto_notify\Controller\TestController::test'
    _title: 'test'
  requirements:
    _permission: 'access content'

message_auto_notify.message_auto_notify_settings_form:
  path: '/admin/message_auto_notify/form/settings'
  defaults:
    _form: '\Drupal\message_auto_notify\Form\SettingsForm'
    _title: 'Auto notify settings'
  requirements:
    _access: 'TRUE'
